<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DroidBot UTG - Clustered View</title>

    <link href="stylesheets/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/droidbotUI.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/vis.min.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
      /* Import vis.js styles inline to ensure compatibility */
      .vis-network {
        position: relative;
        overflow: hidden;
        touch-action: pan-y;
      }
      
      .vis-network canvas {
        position: relative;
        touch-action: none;
      }
    </style>
    
    <style>
      .cluster-info {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      
      .cluster-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      
      .cluster-item {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
        border: 1px solid #ccc;
      }
      
      .cluster-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 0.5rem;
      }
      
      .state-screenshot {
        max-width: 200px;
        max-height: 300px;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
      }
      
      .screenshot-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.8);
      }
      
      .screenshot-modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 90%;
        max-height: 90%;
      }
      
      .close-modal {
        position: absolute;
        top: 10px;
        right: 25px;
        color: white;
        font-size: 35px;
        font-weight: bold;
        cursor: pointer;
      }
      
      .cluster-filter {
        margin-bottom: 1rem;
      }
      
      .cluster-stats {
        background-color: #e7f3ff;
        border-left: 4px solid #007bff;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      
      /* Custom node styles for vis.js */
      .vis-network canvas {
        outline: none;
      }
    </style>

    <script type="text/javascript" src="utg_clustered.js"></script>
    <script type="text/javascript" src="stylesheets/vis.min.js"></script>
    <script type="text/javascript" src="stylesheets/jquery.min.js"></script>
    <script type="text/javascript" src="stylesheets/bootstrap.min.js"></script>
    <script type="text/javascript" src="clustered_ui.js"></script>
  </head>

  <body onload="draw()">
    <nav class="navbar navbar-inverse navbar-fixed-top">
      <div class="container-fluid">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="#">DroidBot Clustered UTG</a>
        </div>
        <div id="navbar" class="navbar-collapse collapse">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#" onClick="showOverall()">Overall</a></li>
            <li><a href="#" onClick="showOriginalUTG()">Original UTG</a></li>
            <li><a href="#" onClick="showClusteredUTG()">Clustered View</a></li>
            <li><a href="#" onClick="clusterStructures()">Cluster structures</a></li>
            <li><a href="#" onClick="clusterActivities()">Cluster activities</a></li>
            <li><a href="#" onClick="showAbout()">About</a></li>
          </ul>
          <form class="navbar-form navbar-right">
            <input id="utgSearchBar" onkeyup="searchUTG()" type="text" class="form-control" placeholder="Search (activity name, resource id, text, etc.)">
          </form>
        </div>
      </div>
    </nav>

    <div class="container-fluid full_height">
      <div class="row full_height">
        <div class="col-md-7 full_height" id="utg_div">
        </div>
        <div class="col-md-5 sidebar full_height" id="utg_details">
          <h2>Clustered UTG Details</h2>
          <p>Detailed clustering information shown here.</p>
        </div>
      </div>
    </div>
    
    <!-- Screenshot Modal -->
    <div id="screenshotModal" class="screenshot-modal">
      <span class="close-modal" onclick="closeScreenshotModal()">&times;</span>
      <img class="screenshot-modal-content" id="modalImage">
    </div>
  </body>
</html>
